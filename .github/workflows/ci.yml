name: ci

# Manual only: lint, format and mypy have long failed on main, so every push
# mailed a failure. The gate in use is the local pytest run before a deploy
# (AGENTS.md, 4). Run this from the Actions tab when wanted.
on:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/bankai

      - name: Pytest
        run: uv run pytest --cov=bankai --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: bankai-dist
          path: dist/*
